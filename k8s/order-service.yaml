apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: toy-apps
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: 589077667788.dkr.ecr.us-east-1.amazonaws.com/toy-order-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            secretKeyRef:
              name: toy-cluster-secrets
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: KAFKA_SASL_JAAS_CONFIG
          valueFrom:
            secretKeyRef:
              name: toy-cluster-secrets
              key: KAFKA_SASL_JAAS_CONFIG
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: toy-apps
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: order-service
